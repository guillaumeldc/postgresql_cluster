# fix-setuptools.yml
- hosts: postgres_cluster
  become: true
  tasks:
    - name: Force-install modern setuptools (Py3.12-safe)
      ansible.builtin.pip:
        name: "setuptools>=68"
        state: latest
        executable: pip3
        extra_args: "--ignore-installed --force-reinstall --break-system-packages"
        umask: "0022"
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
